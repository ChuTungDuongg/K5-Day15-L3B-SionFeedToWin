# Stack Vintrip cho máy local. Bật profile extra khi cần worker hoặc công cụ quản trị.
name: vintrip

x-be-env: &be-env
  NODE_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  REDIS_URL: redis://redis:6379
  DATABASE_URL_ACCESS: postgres://tf_access:tf_access_dev@postgres:5432/core
  DATABASE_URL_CONTENT: postgres://tf_content:tf_content_dev@postgres:5432/core
  DATABASE_URL_DISCOVERY: postgres://tf_discovery:tf_discovery_dev@postgres:5432/core
  DATABASE_URL_ANALYTICS: postgres://tf_analytics:tf_analytics_dev@postgres:5432/core
  DATABASE_URL_COMMERCE: postgres://tf_commerce:tf_commerce_dev@postgres:5432/core
  DATABASE_URL_NOTIFICATION: postgres://tf_notification:tf_notification_dev@postgres:5432/notification
  # Access token: core-api ký (bỏ trống khoá ở dev thì tự sinh khoá tạm), service khác kiểm qua JWKS.
  AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY:-}
  # Khoá để client mã hoá mật khẩu trước khi gửi (TF056). Bỏ trống ở dev thì tự sinh khoá tạm.
  AUTH_PASSWORD_KEYS: ${AUTH_PASSWORD_KEYS:-}
  AUTH_JWT_ISSUER: tripflix-core
  AUTH_JWT_AUDIENCE: tripflix
  # Web (3100), admin (3200) gọi API qua gateway :8080 từ trình duyệt: CORS và cookie refresh token.
  AUTH_WEB_ORIGINS: ${AUTH_WEB_ORIGINS:-http://localhost:3100,http://localhost:3200}
  AUTH_PASSWORD_RESET_URL: ${AUTH_PASSWORD_RESET_URL:-http://localhost:3100/dat-lai-mat-khau}
  AUTH_EMAIL_VERIFY_URL: ${AUTH_EMAIL_VERIFY_URL:-http://localhost:3100/xac-thuc-email}
  # Dev chạy e2e đăng ký nhiều tài khoản từ cùng IP; production để mặc định 5.
  AUTH_REGISTER_MAX_PER_IP_HOUR: ${AUTH_REGISTER_MAX_PER_IP_HOUR:-1000}
  GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
  JWKS_URL: http://core-api:3000/.well-known/jwks.json
  # Mật khẩu của 3 tài khoản mẫu (pnpm db:seed), chỉ dùng ở máy local.
  SEED_PASSWORD: ${SEED_PASSWORD:-tripflix-dev-123}
  AWS_REGION: ${AWS_REGION:-ap-southeast-2}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET:-tripflix-media-dev}
  S3_KEY_PREFIX: dev/${DEV_NAME:-unknown}/
  MEDIA_CDN_URL: ${MEDIA_CDN_URL:-}
  AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
  CORE_API_INTERNAL_URL: ${CORE_API_INTERNAL_URL:-http://localhost:3000}
  MODERATION_SERVICE_CLIENT_SECRET: ${MODERATION_SERVICE_CLIENT_SECRET:-}

x-node-health: &node-health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

services:
  # Sáu dịch vụ thường trực có tổng giới hạn 3008 MiB. Migrate chạy một lần trước Core API.
  postgres:
    mem_limit: 512m
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ['127.0.0.1:${PG_PORT:-5432}:5432']
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 20

  redis:
    mem_limit: 128m
    image: redis:8.8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:${REDIS_PORT:-6379}:6379']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  migrate:
    mem_limit: 2048m
    restart: "no"
    build: { context: .., dockerfile: apps/core-api/Dockerfile, target: dev }
    command: ['sh', '-c', 'pnpm turbo run build --filter=@tripflix/core-api... && pnpm --filter @tripflix/core-api db:migrate && pnpm --filter @tripflix/core-api db:seed']
    environment:
      <<: *be-env
      NODE_OPTIONS: "--max-old-space-size=1536"
    depends_on:
      postgres: { condition: service_healthy }

  core-api:
    mem_limit: 1280m
    build: { context: .., dockerfile: apps/core-api/Dockerfile, target: dev }
    environment:
      <<: *be-env
      NODE_OPTIONS: "--max-old-space-size=896"
      APP_ROLE: all
      ENABLE_MOCK_PAYMENT: "true"
      PORT: 3000
    ports: ['3000:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      <<: *node-health
    develop:
      watch:
        - { action: sync, path: ../apps/core-api/src, target: /repo/apps/core-api/src }
        - { action: sync+restart, path: ../libs, target: /repo/libs, ignore: ['**/node_modules', '**/dist'] }
        - { action: rebuild, path: ../pnpm-lock.yaml }

  ai-service:
    mem_limit: 640m
    build: &ai-build
      context: '../../ai'
      dockerfile: Dockerfile.vintrip
    environment:
      CORE_API_URL: http://core-api:3000
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      IS_VISOBERT_ENABLED: ${IS_VISOBERT_ENABLED:-false}
      CHAT_LLM_ENABLED: ${CHAT_LLM_ENABLED:-false}
      CHAT_CONTROLLER_PROVIDER: openai
      CHAT_RESPONDER_PROVIDER: openai
      CHAT_CONTROLLER_MODEL: gpt-4o-mini
      CHAT_RESPONDER_MODEL: gpt-4o-mini
      OPENAI_REASONING_EFFORT: ""
      CHAT_IDENTITY_SALT: ${CHAT_IDENTITY_SALT:-}
      CHAT_SYSTEM_DAILY_USD: ${CHAT_SYSTEM_DAILY_USD:-3}
      CORS_ORIGINS: http://localhost:3100,http://localhost:8080,http://localhost:8081
    ports: ['8000:8000']
    depends_on:
      redis: { condition: service_healthy }
      core-api: { condition: service_healthy }

  web:
    mem_limit: 1280m
    build: { context: '../../fe', dockerfile: apps/web/Dockerfile, target: dev }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NODE_OPTIONS: "--max-old-space-size=896"
    ports: ['3100:3100']
    depends_on:
      core-api: { condition: service_healthy }
    develop:
      watch:
        - { action: sync, path: '../../fe/apps/web/src', target: /repo/apps/web/src }
        - { action: sync, path: '../../fe/packages', target: /repo/packages, ignore: ['**/node_modules'] }
        - { action: rebuild, path: '../../fe/pnpm-lock.yaml' }

  traefik:
    mem_limit: 64m
    image: traefik:v3.7
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --api.dashboard=true
      - --api.insecure=true
    ports: ['8080:80', '8081:8080']
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro

  notification-service:
    profiles: [extra]
    mem_limit: 512m
    build: { context: .., dockerfile: apps/notification-service/Dockerfile, target: dev }
    environment:
      <<: *be-env
      PORT: 3001
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: Vintrip <no-reply@vintrip.local>
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3100}
    ports: ['3001:3001']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      <<: *node-health
    develop:
      watch:
        - { action: sync, path: ../apps/notification-service/src, target: /repo/apps/notification-service/src }
        - { action: sync+restart, path: ../libs, target: /repo/libs, ignore: ['**/node_modules', '**/dist'] }
        - { action: rebuild, path: ../pnpm-lock.yaml }

  video-worker:
    profiles: [extra]
    mem_limit: 768m
    build: { context: .., dockerfile: apps/video-worker/Dockerfile, target: dev }
    environment: *be-env
    depends_on:
      redis: { condition: service_healthy }
    develop:
      watch:
        - { action: sync, path: ../apps/video-worker/src, target: /repo/apps/video-worker/src }
        - { action: sync+restart, path: ../libs, target: /repo/libs, ignore: ['**/node_modules', '**/dist'] }
        - { action: rebuild, path: ../pnpm-lock.yaml }

  ai-summary-worker:
    profiles: [extra]
    mem_limit: 1536m
    build: *ai-build
    command: ['/app/.venv/bin/python', '-m', 'app.workers.summary_worker']
    environment:
      CORE_API_URL: http://core-api:3000
      REDIS_URL: redis://redis:6379
      # Dev mặc định fake (không gọi LLM thật); đặt LLM_PROVIDER trong deploy/.env để đổi.
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_MODEL: ${LLM_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET:-}
      SUMMARY_LLM_KILL: ${SUMMARY_LLM_KILL:-false}
      # Bộ phân loại bình luận: khoảng 2 nhân CPU, ~820 MB RAM lúc cao nhất. Nếu giới hạn CPU container thì đặt số luồng bằng số nhân đó.
      CLASSIFIER_THREADS: ${CLASSIFIER_THREADS:-2}
      # logging của Python chỉ nhận chữ hoa (DEBUG, INFO), không dùng chung LOG_LEVEL=debug của BE.
      LOG_LEVEL: ${AI_WORKER_LOG_LEVEL:-INFO}
    depends_on:
      redis: { condition: service_healthy }
      core-api: { condition: service_healthy }
    restart: unless-stopped

  admin:
    profiles: [extra]
    mem_limit: 640m
    build: { context: '../../fe', dockerfile: apps/admin/Dockerfile, target: dev }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports: ['3200:3200']
    develop:
      watch:
        - { action: sync, path: '../../fe/apps/admin/src', target: /repo/apps/admin/src }
        - { action: sync, path: '../../fe/packages', target: /repo/packages, ignore: ['**/node_modules'] }
        - { action: rebuild, path: '../../fe/pnpm-lock.yaml' }

  mailpit:
    profiles: [extra]
    mem_limit: 64m
    image: axllent/mailpit:v1.33
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']

  adminer:
    profiles: [extra]
    mem_limit: 64m
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports: ['127.0.0.1:8090:8080']

  redisinsight:
    profiles: [extra]
    mem_limit: 256m
    image: redis/redisinsight:3.8
    ports: ['127.0.0.1:5540:5540']

volumes:
  pg-data:
  redis-data:
